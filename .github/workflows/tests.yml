name: tests

on:
  push:
  pull_request:

# The unit suite compiles only the game-free sources, so it runs without
# Celeste, Everest or SpeedrunTool. The mod itself is not built here.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Tests/
